
name: Dental Casebook Build Check

on:
  push:
    branches:
      - feature/dental-casebook
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "sanity/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/dental-casebook-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Production build
        run: pnpm build
